<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>SPI ゲージタイマー</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#eef3fa;background:#101827}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}.app{width:min(100%,540px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;color:#b7c4d7;font-size:14px}h1{font-size:22px;color:#fff;margin:0 0 6px}.panel{background:#1a2638;border:1px solid #314159;border-radius:20px;padding:26px 20px;margin-bottom:16px}.labels{display:flex;justify-content:space-between;color:#aabbd0;font-size:12px;margin-bottom:14px}.track{height:25px;display:flex;background:#334156;border-radius:100px;overflow:hidden}.segment{height:100%;flex:none;width:0}.blue{background:#328be5}.yellow{background:#efb448}.red{background:#ef6363}.message{text-align:center;color:#b7c4d7;font-size:14px;min-height:22px;margin-top:22px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{cursor:pointer;touch-action:manipulation;border:1px solid #465570;border-radius:13px;background:#24334a;color:#f7f9fd;padding:16px;font-size:16px;font-weight:650}button.primary{background:#347dd5;border-color:#347dd5}.next{width:100%;margin-top:12px}details{margin-top:20px;border:1px solid #334156;border-radius:14px;padding:15px;color:#e7edf7}summary{cursor:pointer}.options{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.options button{font-size:14px;padding:10px 13px}.options button.selected{background:#345a8c;border-color:#6fa9ef}.note{color:#98a9be;font-size:12px;line-height:1.6;margin-top:12px}footer{color:#8194aa;font-size:12px;line-height:1.6;margin-top:20px;text-align:center}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head><body><main class="app"><h1>SPI ゲージタイマー</h1><header><span id="status">待機中</span><span id="question">問題 1</span></header><section class="panel"><div class="labels"><span>開始</span><span>時間切れ</span></div><div class="track" role="progressbar" aria-label="経過時間" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="blue" class="segment blue"></div><div id="yellow" class="segment yellow"></div><div id="red" class="segment red"></div></div><div class="message" id="message" aria-live="polite">開始すると左から右へ伸びます</div></section><div class="actions"><button id="start" class="primary">開始</button><button id="reset">リセット</button></div><button id="next" class="next">次の問題へ →</button><details><summary>制限時間の設定</summary><div class="options" id="options"><button data-time="30000">30秒</button><button data-time="45000">45秒</button><button data-time="60000" class="selected">60秒</button><button data-time="90000">90秒</button><button data-time="120000">120秒</button></div><div class="note">数字は設定画面だけに表示されます。青55%・黄25%・赤20%で、すでに伸びた色は変わりません。</div></details><footer>SPIの公式画面ではなく、時間配分の練習用アプリです。</footer></main><script>const $=id=>document.getElementById(id);let duration=60000,elapsed=0,running=false,startedAt=0,raf=0,question=1;const track=document.querySelector('.track');function render(){const p=Math.min(1,elapsed/duration);$('blue').style.width=Math.min(p,.55)*100+'%';$('yellow').style.width=Math.max(0,Math.min(p,.8)-.55)*100+'%';$('red').style.width=Math.max(0,p-.8)*100+'%';track.setAttribute('aria-valuenow',Math.round(p*100))}function stop(){if(running){elapsed=Math.min(duration,elapsed+performance.now()-startedAt)}running=false;cancelAnimationFrame(raf);render()}function tick(){if(!running)return;const current=Math.min(duration,elapsed+performance.now()-startedAt),p=current/duration;$('blue').style.width=Math.min(p,.55)*100+'%';$('yellow').style.width=Math.max(0,Math.min(p,.8)-.55)*100+'%';$('red').style.width=Math.max(0,p-.8)*100+'%';track.setAttribute('aria-valuenow',Math.round(p*100));if(current>=duration){elapsed=duration;running=false;$('status').textContent='時間切れ';$('message').textContent='制限時間が終了しました';$('start').textContent='再開始';return}raf=requestAnimationFrame(tick)}function begin(){if(elapsed>=duration)elapsed=0;running=true;startedAt=performance.now();$('status').textContent='計測中';$('message').textContent='';$('start').textContent='一時停止';raf=requestAnimationFrame(tick)}function reset(){stop();elapsed=0;render();$('status').textContent='待機中';$('message').textContent='開始すると左から右へ伸びます';$('start').textContent='開始'}$('start').onclick=()=>{if(running){stop();$('status').textContent='一時停止中';$('start').textContent='再開'}else begin()};$('reset').onclick=reset;$('next').onclick=()=>{const wasRunning=running;question++;$('question').textContent='問題 '+question;reset();if(wasRunning)begin()};document.querySelectorAll('[data-time]').forEach(button=>button.onclick=()=>{duration=Number(button.dataset.time);document.querySelectorAll('[data-time]').forEach(b=>b.classList.toggle('selected',b===button));reset()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running)tick()});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();</script></body></html>
